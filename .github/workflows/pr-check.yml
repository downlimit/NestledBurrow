name: Pull Request Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify Scope
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      full_validation: ${{ steps.classify.outputs.full_validation }}
      browser: ${{ steps.classify.outputs.browser }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        run: node scripts/classify-pr-scope.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Verify scope classifier
        run: node scripts/check-pr-scope.mjs

  build:
    name: Validate
    needs: scope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.scope.outputs.full_validation == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        if: needs.scope.outputs.full_validation == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        if: needs.scope.outputs.full_validation == 'true'
        run: npm ci

      - name: Install visual check dependencies
        if: needs.scope.outputs.full_validation == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run project checks
        if: needs.scope.outputs.full_validation == 'true'
        run: npm run check

      - name: Run metadata checks
        if: needs.scope.outputs.full_validation == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/check-doc-contracts.mjs
          node scripts/check-task-identity-contract.mjs
          node scripts/check-pr-scope.mjs
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Upload world previews
        if: always() && needs.scope.outputs.full_validation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: world-previews-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/world-overview.png
            artifacts/camera-indoor.png
            artifacts/camera-outdoor.png
            artifacts/top-wall-detail.png
            artifacts/character-diagonal-contact-sheet.png
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser E2E
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run check:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}
          path: artifacts/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-pr-${{ github.event.pull_request.number }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7
