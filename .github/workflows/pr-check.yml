name: Pull Request Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - closed

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify Scope
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      full_validation: ${{ steps.classify.outputs.full_validation }}
      browser: ${{ steps.classify.outputs.browser }}
      preview: ${{ steps.classify.outputs.preview }}
      auto_merge: ${{ steps.classify.outputs.auto_merge }}
      metadata_valid: ${{ steps.classify.outputs.metadata_valid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/classify-pr-scope.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --body-env PR_BODY

      - name: Verify delivery metadata
        env:
          METADATA_VALID: ${{ steps.classify.outputs.metadata_valid }}
        run: test "$METADATA_VALID" = "true"

      - name: Enforce pending preview phase
        if: steps.classify.outputs.preview == 'true'
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: test "$IS_DRAFT" = "true"

      - name: Verify scope classifier
        run: node scripts/check-pr-scope.mjs

  build:
    name: Static Validation
    needs: scope
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.scope.outputs.full_validation == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        if: needs.scope.outputs.full_validation == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        if: needs.scope.outputs.full_validation == 'true'
        run: npm ci

      - name: Install visual check dependencies
        if: needs.scope.outputs.full_validation == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run owner and system checks
        if: needs.scope.outputs.full_validation == 'true'
        env:
          NESTLEDBURROW_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
        run: npm run check:owners

      - name: Run historical regressions
        if: needs.scope.outputs.full_validation == 'true'
        run: npm run check:history

      - name: Build production bundle
        if: needs.scope.outputs.full_validation == 'true'
        run: npm run build

      - name: Run metadata checks
        if: needs.scope.outputs.full_validation == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/check-doc-contracts.mjs
          node scripts/check-task-identity-contract.mjs
          node scripts/check-pr-preview-contract.mjs
          node scripts/check-pr-scope.mjs
          node scripts/check-validation-funnel.mjs
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Upload world previews
        if: failure() && needs.scope.outputs.full_validation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: world-previews-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/world-overview.png
            artifacts/camera-indoor.png
            artifacts/camera-outdoor.png
            artifacts/top-wall-detail.png
            artifacts/character-diagonal-contact-sheet.png
          if-no-files-found: warn
          retention-days: 7

  browser-shard:
    name: Browser E2E Shard ${{ matrix.shard }}/3
    needs: [scope, build]
    if: >-
      github.event.pull_request.draft == false &&
      needs.scope.outputs.browser == 'true' &&
      needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium headless shell
        run: npx playwright install --only-shell chromium

      - name: Run browser checks
        run: npm run check:e2e -- --shard=${{ matrix.shard }}/3 --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}-shard-${{ matrix.shard }}
          path: artifacts/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-pr-${{ github.event.pull_request.number }}-shard-${{ matrix.shard }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser E2E
    needs: [scope, build, browser-shard]
    if: >-
      always() &&
      github.event.pull_request.draft == false &&
      needs.scope.outputs.browser == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify all browser shards
        env:
          SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: test "$SHARD_RESULT" = "success"

  preview:
    name: Publish Direct Preview
    needs: scope
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'ready_for_review' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.scope.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build static preview
        run: npm run build -- --base=./

      - name: Publish preview branch
        if: github.event.repository.private == false
        id: publish
        env:
          PREVIEW_BRANCH: preview-pr-${{ github.event.pull_request.number }}
          PREVIEW_URL: https://raw.githack.com/${{ github.repository }}/preview-pr-${{ github.event.pull_request.number }}/index.html
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/nestled-preview"
          rm -rf "$output"
          mkdir -p "$output"
          cp -a dist/. "$output/"
          touch "$output/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan preview-output
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$output/." .
          git add -A
          git commit -m "Preview PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
          git push --force origin "HEAD:refs/heads/$PREVIEW_BRANCH"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public preview
        if: github.event.repository.private == false
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if page="$(curl --fail --silent --show-error --location "$PREVIEW_URL" 2>/dev/null)" \
              && grep -q '<title>NestledBurrow</title>' <<<"$page"; then
              echo "Direct preview ready: $PREVIEW_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Direct preview did not become available: $PREVIEW_URL" >&2
          exit 1

      - name: Publish preview link to PR
        if: github.event.repository.private == false
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- nestled-burrow-direct-preview -->';
            const body = `${marker}\n## Игровая препроверка\n\n[Открыть игру](${process.env.PREVIEW_URL})\n\nЭто готовая статическая сборка текущего head. Ничего устанавливать или запускать не нужно.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Verify private preview artifact
        if: github.event.repository.private
        run: grep -q '<title>NestledBurrow</title>' dist/index.html

      - name: Upload private preview artifact
        if: github.event.repository.private
        id: private-preview
        uses: actions/upload-artifact@v4
        with:
          name: game-preview-pr-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish private preview artifact link to PR
        if: github.event.repository.private
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.private-preview.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- nestled-burrow-direct-preview -->';
            const body = `${marker}\n## Игровая препроверка\n\n[Скачать статическую сборку текущего head](${process.env.PREVIEW_URL})\n\nРепозиторий приватный, поэтому анонимный CDN недоступен. Архив содержит готовый \`dist\`; установка и сборка не требуются.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    name: Remove Direct Preview
    needs: scope
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       github.event.action == 'ready_for_review' ||
       (needs.scope.result == 'success' && needs.scope.outputs.preview != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Delete preview branch
        env:
          PREVIEW_BRANCH: preview-pr-${{ github.event.pull_request.number }}
        run: git push origin --delete "$PREVIEW_BRANCH" || true

      - name: Mark preview as removed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nestled-burrow-direct-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\nПубличная игровая препроверка удалена: текущий PR не находится в ChatGPT pending Draft route.`,
              });
            }
