name: Apply Exhaustion Wake Fix

on:
  push:
    branches:
      - agent/atoll-melee-browser-key-guard
    paths:
      - .github/workflows/agent-apply-exhaustion-wake.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atoll-melee-browser-key-guard
          fetch-depth: 0
      - name: Apply shared exhaustion wake behavior
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Missing patch anchor in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/interaction/worldInteractionCoordinator.js",
              "  getSleepingWakeInteraction = () => null,\n  isSleeping = () => false,",
              "  getSleepingWakeInteraction = () => null,\n  getExhaustedWakeInteraction = () => null,\n  isSleeping = () => false,",
          )
          replace_once(
              "src/interaction/worldInteractionCoordinator.js",
              "    const wake = isSleeping() && !isExhaustedSleeping() ? getSleepingWakeInteraction() : null;\n    return [",
              "    const wake = isSleeping() && !isExhaustedSleeping() ? getSleepingWakeInteraction() : null;\n    const exhaustedWake = isExhaustedSleeping() ? getExhaustedWakeInteraction() : null;\n    return [",
          )
          replace_once(
              "src/interaction/worldInteractionCoordinator.js",
              "      ...(wake ? [wake] : []),\n    ];",
              "      ...(wake ? [wake] : []),\n      ...(exhaustedWake ? [exhaustedWake] : []),\n    ];",
          )

          replace_once(
              "src/main.js",
              "      getSleepingWakeInteraction: () => this.getSleepingWakeInteraction(),\n      isSleeping: () => this.sleeping,",
              "      getSleepingWakeInteraction: () => this.getSleepingWakeInteraction(),\n      getExhaustedWakeInteraction: () => this.getExhaustionWakeInteraction(),\n      isSleeping: () => this.sleeping,",
          )
          replace_once(
              "src/main.js",
              "    const gameplayOverlay = this.gameHudHidden || buildActive || this.cookingOverlayActive || this.gameHudConfirmationActive;\n    this.gameHud?.setSuppressed?.(this.gameHudHidden || buildActive);",
              "    const gameplayOverlay = this.gameHudHidden || buildActive || this.cookingOverlayActive || this.gameHudConfirmationActive;\n    const exhaustionWakeAvailable = this.isExhaustionWakeAvailable();\n    this.gameHud?.setSuppressed?.(this.gameHudHidden || buildActive);",
          )
          replace_once(
              "src/main.js",
              "    this.uiVisibilityCoordinator?.setClassHidden(\"inventory-action-blocked\", this.gameHud?.isInventoryInteractionBlocked?.() ?? false);",
              "    this.uiVisibilityCoordinator?.setClassHidden(\n      \"inventory-action-blocked\",\n      Boolean(this.gameHud?.isInventoryInteractionBlocked?.()) && !exhaustionWakeAvailable,\n    );",
          )
          replace_once(
              "src/main.js",
              "    this.debrisRuntime?.setSleeping(true, this.sleepingBedId);\n    this.syncLowEnergyMarker();\n    this.interactionRuntime?.refresh?.();",
              "    this.debrisRuntime?.setSleeping(true, this.sleepingBedId);\n    this.syncLowEnergyMarker();\n    this.syncGameplayHudVisibility();\n    this.interactionRuntime?.refresh?.();",
          )
          replace_once(
              "src/main.js",
              "    this.debrisRuntime?.setSleeping(false);\n    this.sleepingBedId = null;\n    this.syncLowEnergyMarker();\n    this.interactionRuntime?.refresh?.();",
              "    this.debrisRuntime?.setSleeping(false);\n    this.sleepingBedId = null;\n    this.syncLowEnergyMarker();\n    this.syncGameplayHudVisibility();\n    this.interactionRuntime?.refresh?.();",
          )
          replace_once(
              "src/main.js",
              "    const interactionBlocked = this.gameHud?.isInventoryInteractionBlocked?.() ?? false;",
              "    const interactionBlocked = Boolean(this.gameHud?.isInventoryInteractionBlocked?.())\n      && !this.isExhaustionWakeAvailable();",
          )

          old_wake_block = '''  getSleepingWakeInteraction() {
    const position = this.playerCharacter?.motor?.position ?? BED_OBJECT.position;
    return {
      ...BED_OBJECT,
      position: { x: position.x, y: position.y },
      radius: 24,
      priority: 100,
      requiresFacing: false,
      facingDotThreshold: -1,
      prompt: "hud:interaction.wake",
    };
  }

  tryWakeFromExhaustion() {
    if (!this.exhaustedSleeping) return { status: "ignored", mutated: false };
    this.gameHud?.showTransientMessage?.("hud:interaction.wakeFailed");
    return { status: "collapse-locked", mutated: false, transientMessageShown: true };
  }
'''
          new_wake_block = '''  isExhaustionWakeAvailable() {
    return Boolean(this.exhaustedSleeping)
      && this.sessionState?.currentWorldId !== WORLD_IDS.atoll
      && !this.atollCollapseTransitionActive;
  }

  getExhaustionWakeInteraction() {
    if (!this.isExhaustionWakeAvailable()) return null;
    const position = this.playerCharacter?.motor?.position ?? { x: 0, y: 0 };
    return {
      id: "wake-exhausted-player",
      entityId: "wake-exhausted-player",
      roomId: this.sessionState?.currentWorldId ?? "world",
      kind: "wake-exhausted",
      position: { x: position.x, y: position.y },
      radius: 24,
      priority: 100,
      requiresFacing: false,
      facingDotThreshold: -1,
      prompt: "hud:interaction.tryWake",
      payload: {},
    };
  }

  getSleepingWakeInteraction() {
    const position = this.playerCharacter?.motor?.position ?? BED_OBJECT.position;
    return {
      ...BED_OBJECT,
      position: { x: position.x, y: position.y },
      radius: 24,
      priority: 100,
      requiresFacing: false,
      facingDotThreshold: -1,
      prompt: "hud:interaction.wake",
    };
  }

  getWakeProbability() {
    const gameplay = this.sessionState.gameplay;
    const fraction = gameplay.maximumEnergy > 0 ? gameplay.currentEnergy / gameplay.maximumEnergy : 0;
    if (fraction < 0.05) return 0.1;
    if (fraction < 0.1) return 0.66;
    return fraction > 0.25 ? 1 : 0.66;
  }

  tryWakeFromExhaustion(random = Math.random) {
    if (!this.isExhaustionWakeAvailable()) return { status: "ignored", mutated: false };
    const nowMs = globalThis.performance?.now?.() ?? Date.now();
    if (nowMs - this.lastWakeAttemptAtMs < this.gameplayTuning.exhaustionWakeCooldownSeconds * 1000) {
      return { status: "cooldown", mutated: false };
    }
    this.lastWakeAttemptAtMs = nowMs;
    if (random() < this.getWakeProbability()) {
      this.wakeUp();
      return { status: "awake", mutated: true };
    }
    this.gameHud?.showTransientMessage?.("hud:interaction.wakeFailed");
    return { status: "wake-failed", mutated: false, transientMessageShown: true };
  }
'''
          replace_once("src/main.js", old_wake_block, new_wake_block)

          for locale, value in [("ru", "Попытаться проснуться"), ("en", "Try to wake up")]:
              path = Path(f"public/locales/{locale}/hud.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              data["interaction"]["tryWake"] = value
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          Path("tests/e2e/exhaustion-wake.spec.js").write_text('''import { expect, test } from "@playwright/test";

async function bridge(page, method, argument) {
  return page.evaluate(({ method, argument }) => window.__NESTLED_BURROW_E2E__?.[method]?.(argument), { method, argument });
}

async function boot(page) {
  await page.setViewportSize({ width: 320, height: 180 });
  await page.goto("./");
  await page.waitForFunction(() => Boolean(window.__NESTLED_BURROW_E2E__));
  await expect(page.locator("canvas")).toHaveJSProperty("width", 320);
}

async function tapAlt(page) {
  await page.keyboard.down("Alt");
  await page.waitForTimeout(60);
  await page.keyboard.up("Alt");
}

async function collapse(page) {
  await bridge(page, "setWakeRandomValue", 0);
  await bridge(page, "setEnergy", 0);
  await expect.poll(async () => bridge(page, "getRuntimeState")).toMatchObject({
    sleeping: true,
    exhaustedSleeping: true,
  });
  await expect.poll(async () => bridge(page, "getInteractionState")).toMatchObject({
    candidate: { kind: "wake-exhausted", prompt: "hud:interaction.tryWake" },
  });
}

test("exhaustion wake remains usable in peaceful and combat inventory modes", async ({ page }, testInfo) => {
  test.skip(testInfo.project.name.startsWith("mobile"), "physical inventory modes are desktop-only");
  await boot(page);

  await collapse(page);
  await expect.poll(async () => bridge(page, "getInteractionHudState")).toMatchObject({
    suppressed: false,
    promptVisible: true,
  });
  await page.keyboard.press("Space");
  await expect.poll(async () => bridge(page, "getRuntimeState")).toMatchObject({
    sleeping: false,
    exhaustedSleeping: false,
  });

  await tapAlt(page);
  await expect.poll(async () => (await bridge(page, "getHudState")).inventoryMode).toMatchObject({
    mode: "COMBAT",
    stableMode: "COMBAT",
    transitioning: false,
  });

  await collapse(page);
  await expect.poll(async () => bridge(page, "getInteractionHudState")).toMatchObject({
    suppressed: false,
    promptVisible: true,
  });
  await page.keyboard.press("Space");
  await expect.poll(async () => bridge(page, "getRuntimeState")).toMatchObject({
    sleeping: false,
    exhaustedSleeping: false,
  });
});

test("Wild Atoll knockout exposes no manual wake attempt", async ({ page }, testInfo) => {
  test.skip(testInfo.project.name.startsWith("mobile"), "Atoll keyboard route is covered on desktop");
  await boot(page);

  await bridge(page, "enterTransport", "village-nest-transport");
  await expect.poll(async () => (await bridge(page, "getLocationState")).worldId).toBe("nest");
  await bridge(page, "placePlayerAt", { x: 11 * 16, y: 7 * 16, facing: { x: 0, y: -1 } });
  await page.waitForTimeout(120);
  await page.keyboard.press("Space");
  await expect.poll(async () => (await bridge(page, "getLocationState")).worldId).toBe("atoll");

  await bridge(page, "setEnergy", 0);
  await expect.poll(async () => bridge(page, "getRuntimeState")).toMatchObject({
    sleeping: true,
    exhaustedSleeping: true,
  });
  await page.waitForTimeout(100);
  expect((await bridge(page, "getInteractionState")).candidate).toBeNull();
  await expect.poll(async () => bridge(page, "getInteractionHudState")).toMatchObject({
    promptVisible: false,
  });
});
''', encoding="utf-8")
          PY
      - name: Commit patched behavior
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-apply-exhaustion-wake.yml
          git add src/main.js src/interaction/worldInteractionCoordinator.js public/locales/ru/hud.json public/locales/en/hud.json tests/e2e/exhaustion-wake.spec.js
          git commit -m "Restore exhaustion wake outside Wild Atoll"
          git push origin HEAD:agent/atoll-melee-browser-key-guard
