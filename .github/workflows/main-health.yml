name: Main Health Backstop

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-health
  cancel-in-progress: true

jobs:
  validate-unreviewed-push:
    name: Validate unreviewed main push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect normal PR merge
        id: route
        shell: bash
        run: |
          set -euo pipefail
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{ print NF - 1 }')"
          if [ "$parent_count" -gt 1 ]; then
            echo "validate=false" >> "$GITHUB_OUTPUT"
            echo "Merge commit: PR final-head CI is the validation boundary."
          else
            echo "validate=true" >> "$GITHUB_OUTPUT"
            echo "Single-parent main push: run the full static repository gate as a backstop."
          fi

      - name: Setup Node.js
        if: steps.route.outputs.validate == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        if: steps.route.outputs.validate == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        if: steps.route.outputs.validate == 'true'
        run: npm ci

      - name: Install visual check dependencies
        if: steps.route.outputs.validate == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run full static repository gate
        if: steps.route.outputs.validate == 'true'
        run: npm run check
