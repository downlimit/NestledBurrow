name: Task 044 Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Diagnostic report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture failing contracts
        shell: bash
        run: |
          set +e
          npm run check:docs > docs.log 2>&1
          docs_code=$?
          npm run check:hud > hud.log 2>&1
          hud_code=$?
          {
            echo 'Task #044 diagnostic output:'
            echo
            echo '```text'
            echo "check:docs exit ${docs_code}"
            tail -n 40 docs.log
            echo
            echo "check:hud exit ${hud_code}"
            tail -n 40 hud.log
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
        env:
          GH_TOKEN: ${{ github.token }}
