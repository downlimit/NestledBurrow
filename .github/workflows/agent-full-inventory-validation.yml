name: Full inventory change validation

on:
  push:
    branches:
      - agent/preserve-inventory-selection-wheel

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-inventory-selection-wheel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run full project validation
        run: npm run check

      - name: Remove temporary validator
        run: rm .github/workflows/agent-full-inventory-validation.yml

      - name: Commit validation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-full-inventory-validation.yml
          git commit -m "Complete full inventory change validation"
          git push origin HEAD:agent/preserve-inventory-selection-wheel
