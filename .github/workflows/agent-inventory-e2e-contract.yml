name: Apply inventory E2E contract

on:
  push:
    branches:
      - agent/preserve-inventory-selection-wheel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-inventory-selection-wheel
          fetch-depth: 0

      - name: Apply verified inventory behavior
        shell: python
        run: |
          import re
          import textwrap
          from pathlib import Path

          def sub_once(path, pattern, replacement, flags=0):
              source = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {pattern[:100]!r}")
              path.write_text(updated, encoding="utf-8")

          runtime = Path("src/inventory/inventoryRuntime.js")
          sub_once(
              runtime,
              r"  function worldPresentationActive\(\) \{\r?\n    return !destroyed && !isSuppressed\(\);\r?\n  \}",
              "  function worldPresentationActive() {\n    return !destroyed && !isSuppressed() && !isCombatMode();\n  }",
          )
          sub_once(
              runtime,
              r"    getSelectedItem: \(\) => cloneInventoryItem\(selectedIndex === null \? null : inventory\(\)\?\.slots\?\.\[selectedIndex\]\),",
              "    getSelectedItem: () => cloneInventoryItem(\n      isCombatMode() || selectedIndex === null ? null : inventory()?.slots?.[selectedIndex],\n    ),",
          )

          checks = Path("scripts/check-inventory.mjs")
          sub_once(
              checks,
              re.escape('assert(runtimeSource.includes("worldPresentationActive()"), "held world-space item visibility stays outside panel interactivity");'),
              'assert(runtimeSource.includes("worldPresentationActive()") && runtimeSource.includes("!isCombatMode()"), "held peaceful item stays selected but is hidden while combat mode owns presentation");',
          )

          e2e = Path("tests/e2e/task-053-peaceful-combat-hud.spec.js")
          new_test = textwrap.dedent('''\
          test("Alt tap preserves peaceful selection while hidden inventory shortcuts stay inactive", async ({ page }, testInfo) => {
            test.skip(testInfo.project.name.startsWith("mobile"), "Task #053 defines desktop physical Alt only");
            await boot(page);

            await expect.poll(() => inventoryMode(page)).toMatchObject({
              mode: "PEACEFUL",
              stableMode: "PEACEFUL",
              transitioning: false,
              earVisible: true,
              peaceful: { scale: 1, alpha: 1, inputEnabled: true },
              combat: { alpha: 0, inputEnabled: false },
            });
            expect((await inventoryMode(page)).combat.slots.map(({ label }) => label))
              .toEqual(["SPACE", "LMB", "RMB", "SHIFT", "1", "2", "3", "4", "5", "6"]);

            await page.keyboard.press("Digit1");
            await expect.poll(async () => (await bridge(page, "getHudState")).resources.inventory.selectedIndex).toBe(0);

            await tapAlt(page);
            await expect.poll(() => inventoryMode(page), { timeout: 1500 }).toMatchObject({
              mode: "COMBAT",
              stableMode: "COMBAT",
              transitioning: false,
              earVisible: false,
              peaceful: { scale: 0.3, alpha: 0, inputEnabled: false },
              combat: { scale: 1, alpha: 1, inputEnabled: true },
            });
            await expect.poll(() => interactionHud(page)).toMatchObject({
              suppressed: true,
              promptVisible: false,
            });
            await expect.poll(async () => (await bridge(page, "getHudState")).resources.inventory.selectedIndex).toBe(0);
            await page.keyboard.press("Digit2");
            await page.keyboard.press("KeyE");
            await page.locator("canvas").hover();
            await page.mouse.wheel(0, 120);
            expect((await bridge(page, "getHudState")).resources.inventory.selectedIndex).toBe(0);

            await tapAlt(page);
            await expect.poll(() => inventoryMode(page), { timeout: 1500 }).toMatchObject({
              mode: "PEACEFUL",
              stableMode: "PEACEFUL",
              transitioning: false,
              earVisible: true,
              peaceful: { scale: 1, alpha: 1, inputEnabled: true },
              combat: { alpha: 0 },
            });
            await expect.poll(() => interactionHud(page)).toMatchObject({ suppressed: false });
            await expect.poll(async () => (await bridge(page, "getHudState")).resources.inventory.selectedIndex).toBe(0);
            await page.mouse.wheel(0, 120);
            await expect.poll(async () => (await bridge(page, "getHudState")).resources.inventory.selectedIndex).toBe(1);
            await page.mouse.wheel(0, -120);
            await expect.poll(async () => (await bridge(page, "getHudState")).resources.inventory.selectedIndex).toBe(0);
          });

          ''')
          sub_once(
              e2e,
              r'test\("Alt tap toggles peaceful/combat and hidden inventory shortcuts stay inactive"[\s\S]*?\n\}\);\r?\n\r?\n(?=test\("held Alt)',
              new_test,
          )

          Path(".github/workflows/agent-inventory-e2e-contract.yml").unlink()

      - name: Commit inventory behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/inventory/inventoryRuntime.js scripts/check-inventory.mjs tests/e2e/task-053-peaceful-combat-hud.spec.js .github/workflows/agent-inventory-e2e-contract.yml
          git commit -m "Preserve peaceful selection across combat mode"
          git push origin HEAD:agent/preserve-inventory-selection-wheel
